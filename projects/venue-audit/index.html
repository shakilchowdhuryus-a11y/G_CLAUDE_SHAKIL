<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venue Marketing Audit</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1f1d1a;--mute:#6b665f;--acc:#8a6d3b;--line:#e7e2da;--ok:#2f7d4f;--mid:#b7791f;--bad:#b0413e}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1e1b;--ink:#f1ede6;--mute:#a59f95;--acc:#d2b07a;--line:#33302b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 24px}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px;margin:0 0 16px}
legend{font-weight:600;padding:0 6px;color:var(--acc)}
label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
input{margin-top:4px;accent-color:var(--acc)}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer;width:100%}
#out{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.score{font-size:44px;font-weight:700}.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%}ol{padding-left:20px}li{margin:6px 0}
</style>
</head>
<body>
<main>
<h1>Venue Marketing Audit</h1>
<p class="sub">Tick what your wedding venue already does. Get a score and your top fixes in 60 seconds.</p>
<form id="f"></form>
<button id="go">Get my score</button>
<section id="out" aria-live="polite"></section>
</main>
<script>
// EDIT: your booking link (Calendly etc.) and offer price
const BOOKING_URL='https://calendly.com/YOUR-LINK';const OFFER='Done-for-you fix: we implement your top 5 fixes in 14 days.';
const Q={
 "Website":[["Clear pricing or 'from' price on site",3,"Show a 'from' price — hidden pricing loses most enquiries."],
  ["Enquiry form above the fold on mobile",3,"Put the enquiry button in the first screen on mobile."],
  ["Loads in under 3 seconds on mobile",2,"Compress images and cut scripts; slow pages leak leads."],
  ["Real-wedding gallery updated this year",2,"Add 3 recent real weddings with supplier credits."]],
 "Leads":[["Reply to enquiries within 1 hour",3,"Auto-reply instantly, then a personal reply within the hour."],
  ["Follow-up sequence for non-bookers",3,"Set a 5-touch follow-up over 3 weeks."],
  ["Track enquiry source for every lead",2,"Add 'How did you hear about us?' and log it."],
  ["Show-round booking link in replies",2,"Add a self-book show-round link to every reply."]],
 "Content":[["Post Reels at least weekly",3,"Commit to 1 Reel a week: couple moments, venue reveals, testimonials."],
  ["Couple testimonials on video",2,"Film 60-second couple testimonials at the farewell."],
  ["Google Business Profile with 50+ reviews",3,"Ask every couple for a Google review 2 weeks post-wedding."],
  ["Listed on top 2 wedding directories",1,"Keep the two directories that drive bookings; drop the rest."]],
 "Conversion":[["Brochure gated behind email",2,"Swap the free PDF for an email-gated brochure."],
  ["Clear packages with what's included",2,"Publish 2–3 packages with inclusions."],
  ["Urgency: dates-available calendar",1,"Show remaining dates for next season."],
  ["Know your enquiry-to-booking rate",2,"Measure it monthly; it's the number that matters."]]
};
const f=document.getElementById('f');let i=0;
for(const [sec,items] of Object.entries(Q)){
 const fs=document.createElement('fieldset');fs.innerHTML=`<legend>${sec}</legend>`;
 items.forEach(([t,w,fix])=>{fs.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-w="${w}" data-fix="${fix}" id="q${i}"><span>${t}</span></label>`);i++});
 f.appendChild(fs);
}
document.getElementById('go').onclick=()=>{
 const boxes=[...f.querySelectorAll('input')];let max=0,got=0;const gaps=[];
 boxes.forEach(b=>{const w=+b.dataset.w;max+=w;b.checked?got+=w:gaps.push([w,b.dataset.fix])});
 const s=Math.round(got/max*100),c=s>=75?'var(--ok)':s>=45?'var(--mid)':'var(--bad)';
 const verdict=s>=75?'Strong — tune and scale.':s>=45?'Leaking bookings — fix the top gaps first.':'Big upside — these fixes will move bookings fast.';
 gaps.sort((a,b)=>b[0]-a[0]);
 const out=document.getElementById('out');out.style.display='block';
 out.innerHTML=`<div class="score" style="color:${c}">${s}/100</div><div class="bar"><i style="width:${s}%;background:${c}"></i></div><p>${verdict}</p>`+
  (gaps.length?`<h3>Your top fixes</h3><ol>${gaps.slice(0,5).map(g=>`<li>${g[1]}</li>`).join('')}</ol>`:'<p>Every box ticked. Next step: grow ad spend on what converts.</p>')+
  `<p><strong>${OFFER}</strong></p><a href="${BOOKING_URL}" target="_blank" rel="noopener"><button type="button">Book a free 15-min fix call</button></a>`;
 out.scrollIntoView({behavior:'smooth'});
};
</script>
</body>
</html>
